name: Calendario de GitHub

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/calendario-github.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Autor bot: estos commits no cuentan como contribuciones de Luis.
      - run: |
          git add assets/github-calendario.json
          git diff --cached --quiet && exit 0
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "chore(calendario): actualiza contribuciones de GitHub"
          git push
